# Deploy ALTCHA Sentinel to AWS
#
# =Components=
#
# - ECS Fargate Service
# - ALB Application Load Balancer
# - VPC with public subnets
# - (Optional) EFS storage for local persistence (e.g. SQLite), mounted at /data
#
# =Usage=
# aws cloudformation deploy \
#   --template-file altcha-sentinel-aws-ecs.yml \
#   --stack-name altcha-sentinel-stack \
#   --capabilities CAPABILITY_IAM \
#   --parameter-overrides \
#       DomainName=your.domain.com \
#       CertificateArn=arn:aws:acm:region:account:certificate/id
#
# =Enable local persistent storage=
# By default no volume is attached (recommended when using an external
# database). This deployment only supports a single running task
# (DesiredCount: 1), so if you're using a local, file-based database (e.g.
# SQLite) instead of an external one, enable an EFS-backed /data volume so
# it survives task recreation across deployments/restarts:
# aws cloudformation deploy \
#   --template-file altcha-sentinel-aws-ecs.yml \
#   --stack-name altcha-sentinel-stack \
#   --capabilities CAPABILITY_IAM \
#   --parameter-overrides EnablePersistence=true
#
# =Delete stack=
#
# aws cloudformation delete-stack --stack-name altcha-sentinel-stack
#

AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate ARM64 Service with HTTPS ALB

Parameters:
  ImageURI:
    Type: String
    Default: "public.ecr.aws/n6m6b4n8/altcha-org/sentinel:1.36.0"
    Description: Container image URI 
  ServiceName:
    Type: String
    Default: "altcha-sentinel"
  DomainName:
    Type: String
    Default: ""
    Description: (Optional) Your domain name (e.g., example.com)
  CertificateArn:
    Type: String
    Default: ""
    Description: (Optional) ACM certificate ARN (e.g., arn:aws:acm:...)
  CpuArchitecture:
    Type: String
    Default: "ARM64"
    AllowedValues: ["X86_64", "ARM64"]
    Description: CPU architecture for Fargate tasks
  TaskCPU:
    Type: String
    Default: "2048"
    AllowedValues: ["1024", "2048", "4096"]
    Description: CPU units for the task (1024 = 1 vCPU)
  TaskMemory:
    Type: String
    Default: "4096"
    AllowedValues: ["2048", "3072", "4096", "5120", "6144", "7168", "8192", "16384"]
    Description: Memory in MiB (must be compatible with CPU choice)
  EnablePersistence:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Attach an EFS-backed volume (mounted at /data) that persists across
      task recreation - deployments, scaling events, crashes. Leave disabled
      (the default) when using an external database, since no local storage
      is required in that case. Only intended for a single running task
      (DesiredCount: 1); when enabled, deployments are switched to a
      recreate strategy (old task stopped before the new one starts) so two
      tasks never write to the volume at the same time.

  # --- External database (see https://altcha.org/docs/v2/sentinel/advanced/env/) ---
  DatabaseUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: >-
      (Optional) Connection string for an external database. Leave empty to
      use Sentinel's embedded database (requires EnablePersistence=true to
      survive task recreation). Set together with DatabaseUrlVarName.
  DatabaseUrlVarName:
    Type: String
    Default: "POSTGRES_URL"
    AllowedValues: ["POSTGRES_URL", "MYSQL_URL", "MARIADB_URL", "MSSQL_URL", "LIBSQL_URL"]
    Description: Which env var DatabaseUrl is passed as - must match your database engine
  RedisUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: (Optional) REDIS_URL - connection string for an external Redis instance

  # --- License ---
  LicenseKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: (Optional) LICENSE_KEY
  LicenseJson:
    Type: String
    Default: ""
    NoEcho: true
    Description: (Optional) LICENSE_JSON

  # --- Secrets ---
  # Sentinel auto-generates JWT_SECRET, ALTCHA_HMAC_SECRET, CODE_CHALLENGE_SECRET,
  # EXOTDB_HMAC_SECRET and HASHING_SALT with random values if left unset - but
  # that makes them unstable across redeploys, invalidating existing
  # sessions/tokens every time the task restarts. Setting SECRET_SEED instead
  # makes Sentinel derive all of those deterministically from this one value.
  SecretSeed:
    Type: String
    Default: ""
    NoEcho: true
    Description: (Optional) SECRET_SEED - deterministically derives the required secrets, kept stable across redeploys
  NodeId:
    Type: String
    Default: ""
    Description: (Optional) NODE_ID - unique node identifier

  # --- Network/app settings ---
  BaseUrl:
    Type: String
    Default: ""
    Description: (Optional) BASE_URL - used for generating absolute URLs
  AllowedHosts:
    Type: String
    Default: ""
    Description: (Optional) ALLOWED_HOSTS - comma-separated hostnames (supports wildcards)

  # --- Generic passthrough (for anything not covered above) ---
  ExtraEnvName1:
    Type: String
    Default: ""
  ExtraEnvValue1:
    Type: String
    Default: ""
    NoEcho: true
  ExtraEnvName2:
    Type: String
    Default: ""
  ExtraEnvValue2:
    Type: String
    Default: ""
    NoEcho: true
  ExtraEnvName3:
    Type: String
    Default: ""
  ExtraEnvValue3:
    Type: String
    Default: ""
    NoEcho: true

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  PersistenceEnabled: !Equals [!Ref EnablePersistence, "true"]
  HasDatabaseUrl: !Not [!Equals [!Ref DatabaseUrl, ""]]
  HasRedisUrl: !Not [!Equals [!Ref RedisUrl, ""]]
  HasLicenseKey: !Not [!Equals [!Ref LicenseKey, ""]]
  HasLicenseJson: !Not [!Equals [!Ref LicenseJson, ""]]
  HasSecretSeed: !Not [!Equals [!Ref SecretSeed, ""]]
  HasNodeId: !Not [!Equals [!Ref NodeId, ""]]
  HasBaseUrl: !Not [!Equals [!Ref BaseUrl, ""]]
  HasAllowedHosts: !Not [!Equals [!Ref AllowedHosts, ""]]
  HasExtraEnv1: !Not [!Equals [!Ref ExtraEnvName1, ""]]
  HasExtraEnv2: !Not [!Equals [!Ref ExtraEnvName2, ""]]
  HasExtraEnv3: !Not [!Equals [!Ref ExtraEnvName3, ""]]

Resources:
  # --- Networking ---
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # --- ALB with HTTPS ---
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS/HTTP inbound to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ServiceName}-alb"
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ServiceName}-tg"
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /
      HealthCheckPort: "8080"

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # EFS File System (only created when persistence is enabled). Unlike a
  # per-task EBS volume, EFS exists independently of any task's lifecycle,
  # so /data survives task recreation - which a single-instance, file-based
  # database (e.g. SQLite) deployment needs.
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Condition: PersistenceEnabled
    Properties:
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub "${ServiceName}-efs"

  # Mount Targets (one per subnet)
  MountTarget1:
    Type: AWS::EFS::MountTarget
    Condition: PersistenceEnabled
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  MountTarget2:
    Type: AWS::EFS::MountTarget
    Condition: PersistenceEnabled
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId: !Ref PublicSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  # EFS Access Point (for fine-grained permissions)
  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Condition: PersistenceEnabled
    Properties:
      FileSystemId: !Ref EFSFileSystem
      RootDirectory:
        Path: "/data"
        CreationInfo:
          OwnerUid: "1001"
          OwnerGid: "1001"
          Permissions: "755"

  # Security Group for EFS
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: PersistenceEnabled
    Properties:
      GroupDescription: "Allow NFS traffic from ECS tasks"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # --- ECS ---
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ServiceName}-cluster"

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies: !If
        - PersistenceEnabled
        - - PolicyName: EFS-Access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - "elasticfilesystem:ClientMount"
                    - "elasticfilesystem:ClientWrite"
                  Resource: !GetAtt EFSFileSystem.Arn
        - !Ref AWS::NoValue
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ServiceName}-task"
      NetworkMode: awsvpc
      Volumes: !If
        - PersistenceEnabled
        - - Name: efs-volume
            EFSVolumeConfiguration:
              FilesystemId: !Ref EFSFileSystem
              TransitEncryption: ENABLED
              AuthorizationConfig:
                AccessPointId: !Ref EFSAccessPoint
                IAM: ENABLED
        - !Ref AWS::NoValue
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      Cpu: !Ref TaskCPU
      Memory: !Ref TaskMemory
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: !Sub "${ServiceName}-container"
          Image: !Ref ImageURI
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - !If [HasDatabaseUrl, {Name: !Ref DatabaseUrlVarName, Value: !Ref DatabaseUrl}, !Ref AWS::NoValue]
            - !If [HasRedisUrl, {Name: REDIS_URL, Value: !Ref RedisUrl}, !Ref AWS::NoValue]
            - !If [HasLicenseKey, {Name: LICENSE_KEY, Value: !Ref LicenseKey}, !Ref AWS::NoValue]
            - !If [HasLicenseJson, {Name: LICENSE_JSON, Value: !Ref LicenseJson}, !Ref AWS::NoValue]
            - !If [HasSecretSeed, {Name: SECRET_SEED, Value: !Ref SecretSeed}, !Ref AWS::NoValue]
            - !If [HasNodeId, {Name: NODE_ID, Value: !Ref NodeId}, !Ref AWS::NoValue]
            - !If [HasBaseUrl, {Name: BASE_URL, Value: !Ref BaseUrl}, !Ref AWS::NoValue]
            - !If [HasAllowedHosts, {Name: ALLOWED_HOSTS, Value: !Ref AllowedHosts}, !Ref AWS::NoValue]
            - !If [HasExtraEnv1, {Name: !Ref ExtraEnvName1, Value: !Ref ExtraEnvValue1}, !Ref AWS::NoValue]
            - !If [HasExtraEnv2, {Name: !Ref ExtraEnvName2, Value: !Ref ExtraEnvValue2}, !Ref AWS::NoValue]
            - !If [HasExtraEnv3, {Name: !Ref ExtraEnvName3, Value: !Ref ExtraEnvValue3}, !Ref AWS::NoValue]
          MountPoints: !If
            - PersistenceEnabled
            - - SourceVolume: efs-volume
                ContainerPath: /data
            - !Ref AWS::NoValue
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${ServiceName}"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
              awslogs-create-group: "true"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to port 8080
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  ECSService:
    Type: AWS::ECS::Service
    DependsOn: HTTPListener
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      DeploymentConfiguration: !If
        - PersistenceEnabled
        - MinimumHealthyPercent: 0
          MaximumPercent: 100
        - !Ref AWS::NoValue
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: !Sub "${ServiceName}-container"
          ContainerPort: 8080

Outputs:
  ALBDNSName:
    Description: "ALB DNS Name"
    Value: !GetAtt LoadBalancer.DNSName
  ServiceURL:
    Description: "Service URL"
    Value: !If 
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "http://${LoadBalancer.DNSName}"
  TaskSize:
    Description: "Configured Task Size"
    Value: !Sub "${TaskCPU} CPU units (${TaskMemory} MB RAM)"
  Persistence:
    Description: "/data volume status"
    Value: !If
      - PersistenceEnabled
      - "Enabled - EFS volume mounted at /data, survives task recreation"
      - "Disabled - no volume attached"